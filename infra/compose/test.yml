# Test stack for integration and E2E tests (concept chapter 19).
# Separate project, separate ports, no persistence. All ports bound to 127.0.0.1 only.
name: emailplattform-test

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: emailplattform
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: emailplattform
    command:
      [
        "postgres",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
        "-c",
        "max_connections=300",
      ]
    tmpfs: ["/var/lib/postgresql:size=2g"]
    ports: ["127.0.0.1:${TEST_PG_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailplattform -d emailplattform"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8.1.10-alpine
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:${TEST_VALKEY_PORT:-55379}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  greenmail:
    image: greenmail/standalone:2.1.14
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:${TEST_GM_SMTP_PORT:-55025}:3025"
      - "127.0.0.1:${TEST_GM_SMTPS_PORT:-55465}:3465"
      - "127.0.0.1:${TEST_GM_IMAP_PORT:-55143}:3143"
      - "127.0.0.1:${TEST_GM_IMAPS_PORT:-55993}:3993"
      - "127.0.0.1:${TEST_GM_API_PORT:-55080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/service/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'Service running' <&3",
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "20000"
    ports:
      - "127.0.0.1:${TEST_MAILPIT_SMTP_PORT:-55102}:1025"
      - "127.0.0.1:${TEST_MAILPIT_HTTP_PORT:-55825}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  rspamd:
    image: rspamd/rspamd:4.2.3
    ports:
      - "127.0.0.1:${TEST_RSPAMD_PORT:-55333}:11333"
      - "127.0.0.1:${TEST_RSPAMD_CONTROLLER_PORT:-55334}:11334"
